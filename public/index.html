<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dropzone</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    color: #222;
  }
  #zone {
    border: 2px dashed #999;
    border-radius: 12px;
    padding: 3rem 1rem;
    text-align: center;
    color: #666;
    transition: background 0.15s, border-color 0.15s;
  }
  #zone.dragover {
    background: #eef4ff;
    border-color: #4a90d9;
    color: #4a90d9;
  }
  #result {
    margin-top: 1.5rem;
    font-size: 0.95rem;
    background: #f5f5f5;
    border-radius: 8px;
    padding: 1rem;
    display: none;
  }
  #result.error {
    color: #b00020;
    font-family: ui-monospace, monospace;
    white-space: pre-wrap;
  }
  .metadata {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.35rem 1rem;
    margin: 0;
  }
  .metadata dt {
    margin: 0;
    color: #555;
    font-weight: 600;
  }
  .metadata dd {
    margin: 0;
    word-break: break-word;
  }
  .preview-image {
    display: block;
    margin-top: 1rem;
    max-width: 200px;
    max-height: 200px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: #fff;
  }
  .preview-text {
    margin: 1rem 0 0;
    padding: 0.75rem;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, monospace;
    font-size: 0.85rem;
    max-height: 12rem;
    overflow: auto;
  }
</style>
</head>
<body>
  <h1>Dropzone</h1>
  <div id="zone">Drop a file here, or click to choose one</div>
  <input id="file-input" type="file" hidden />
  <div id="result"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
