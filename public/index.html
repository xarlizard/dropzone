<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dropzone</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    color: #222;
  }
  #zone {
    border: 2px dashed #999;
    border-radius: 12px;
    padding: 3rem 1rem;
    text-align: center;
    color: #666;
    transition: background 0.15s, border-color 0.15s;
  }
  #zone.dragover {
    background: #eef4ff;
    border-color: #4a90d9;
    color: #4a90d9;
  }
  #result {
    margin-top: 1.5rem;
    white-space: pre-wrap;
    font-family: ui-monospace, monospace;
    font-size: 0.9rem;
    background: #f5f5f5;
    border-radius: 8px;
    padding: 1rem;
    display: none;
  }
</style>
</head>
<body>
  <h1>Dropzone</h1>
  <div id="zone">Drop a file here, or click to choose one</div>
  <input id="file-input" type="file" hidden />
  <div id="result"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
